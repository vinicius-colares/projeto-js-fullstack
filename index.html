<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Usuários</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- Tela de Login -->
  <div id="tela-login" class="card">
    <h2>Entrar</h2>
    <form id="form-login">
      <input type="email" id="login-email" placeholder="E-mail" required>
      <input type="password" id="login-senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
    <p>Não tem conta? <a id="link-ir-registro">Cadastre-se</a></p>
  </div>

  <!-- Tela de Registro -->
  <div id="tela-registro" class="card escondido">
    <h2>Criar conta</h2>
    <form id="form-registro">
      <input type="email" id="registro-email" placeholder="E-mail" required>
      <input type="password" id="registro-senha" placeholder="Senha" required>
      <button type="submit">Cadastrar</button>
    </form>
    <p>Já tem conta? <a id="link-ir-login">Entrar</a></p>
  </div>

  <!-- Conteúdo principal -->
  <div id="conteudo-principal" class="escondido">
    <header id="cabecalho-usuario">
      <div style="display:flex; align-items:center; gap:12px;">
        <i class="fa-solid fa-users"></i>
        <h1>Sistema de Usuários</h1>
      </div>
      <a href="/tarefas.html" class="link-botao">Minhas tarefas</a>
      <button id="btn-sair">Sair</button>
    </header>

    <div class="card">
      <h2>Usuários cadastrados</h2>
      <input type="text" id="input-busca" placeholder="Buscar por nome...">
      <select id="select-ordenar">
        <option value="nome">Ordenar por Nome</option>
        <option value="curso">Ordenar por Curso</option>
      </select>
      <p id="carregando">Carregando...</p>
      <ul id="lista-usuarios"></ul>
    </div>

    <div class="card">
      <h2>Adicionar novo usuário</h2>
      <form id="form-usuario">
        <input type="text" id="input-nome" placeholder="Nome" required>
        <input type="text" id="input-curso" placeholder="Curso" required>
        <input type="email" id="input-email" placeholder="E-mail" required>
        <button type="submit">Adicionar</button>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <div id="overlay-confirmar">
    <div id="caixa-confirmar">
      <p id="texto-confirmar">Tem certeza?</p>
      <button id="btn-confirmar-sim">Sim, deletar</button>
      <button id="btn-confirmar-nao">Cancelar</button>
    </div>
  </div>

  <div id="overlay-editar">
    <div id="caixa-editar">
      <h3>Editar usuário</h3>
      <input type="text" id="editar-nome" placeholder="Nome">
      <input type="text" id="editar-curso" placeholder="Curso">
      <input type="email" id="editar-email" placeholder="E-mail">
      <div class="botoes-editar">
        <button id="btn-editar-salvar">Salvar</button>
        <button id="btn-editar-cancelar">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
