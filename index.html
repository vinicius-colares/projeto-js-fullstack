<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Usuários</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px 40px;
      background-color: #eef1f7;
      color: #333;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 30px 0 20px;
    }

    header i {
      font-size: 32px;
      color: #2980b9;
    }

    header h1 {
      font-size: 24px;
      color: #2c3e50;
      margin: 0;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #2c3e50;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f9fafc;
      padding: 12px 15px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    li button {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 16px;
      margin-left: 8px;
      padding: 6px 10px;
      border-radius: 4px;
    }

    li button:hover {
      background-color: #e6e9ef;
    }

    .fa-trash {
      color: #e74c3c;
    }

    .fa-pen {
      color: #2980b9;
    }

    #carregando {
      text-align: center;
      color: #888;
      padding: 10px 0;
    }

    form {
      display: flex;
      gap: 10px;
    }

    form input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    form button {
      padding: 10px 18px;
      background-color: #2980b9;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    form button:hover {
      background-color: #1f6690;
    }

    /* Notificação (toast) */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #2c3e50;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
    }

    #toast.mostrar {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.erro {
      background: #c0392b;
    }

    /* Modal de confirmação */
    #overlay-confirmar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
    }

    #overlay-confirmar.mostrar {
      display: flex;
    }

    #caixa-confirmar {
      background: white;
      padding: 24px;
      border-radius: 10px;
      max-width: 320px;
      text-align: center;
    }

    #caixa-confirmar p {
      margin-top: 0;
    }

    #caixa-confirmar button {
      margin: 0 6px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #btn-confirmar-sim {
      background: #e74c3c;
      color: white;
    }

    #btn-confirmar-nao {
      background: #ddd;
    }
  </style>
</head>
<body>

  <header>
    <i class="fa-solid fa-users"></i>
    <h1>Sistema de Usuários</h1>
  </header>

  <div class="card">
    <h2>Usuários cadastrados</h2>
    <p id="carregando">Carregando...</p>
    <ul id="lista-usuarios"></ul>
  </div>

  <div class="card">
    <h2>Adicionar novo usuário</h2>
    <form id="form-usuario">
      <input type="text" id="input-nome" placeholder="Nome" required>
      <input type="text" id="input-curso" placeholder="Curso" required>
      <button type="submit">Adicionar</button>
    </form>
  </div>

  <!-- Notificação -->
  <div id="toast"></div>

  <!-- Modal de confirmação -->
  <div id="overlay-confirmar">
    <div id="caixa-confirmar">
      <p id="texto-confirmar">Tem certeza?</p>
      <button id="btn-confirmar-sim">Sim, deletar</button>
      <button id="btn-confirmar-nao">Cancelar</button>
    </div>
  </div>

  <script>
    // ---------- Notificação (toast) ----------
    function mostrarToast(mensagem, tipo = "sucesso") {
      const toast = document.getElementById("toast");
      toast.textContent = mensagem;
      toast.className = tipo === "erro" ? "mostrar erro" : "mostrar";
      setTimeout(() => {
        toast.className = "";
      }, 2500);
    }

    // ---------- Modal de confirmação ----------
    function confirmarAcao(mensagem) {
      return new Promise((resolve) => {
        const overlay = document.getElementById("overlay-confirmar");
        const texto = document.getElementById("texto-confirmar");
        const btnSim = document.getElementById("btn-confirmar-sim");
        const btnNao = document.getElementById("btn-confirmar-nao");

        texto.textContent = mensagem;
        overlay.classList.add("mostrar");

        function limpar(resultado) {
          overlay.classList.remove("mostrar");
          btnSim.removeEventListener("click", simClick);
          btnNao.removeEventListener("click", naoClick);
          resolve(resultado);
        }

        function simClick() { limpar(true); }
        function naoClick() { limpar(false); }

        btnSim.addEventListener("click", simClick);
        btnNao.addEventListener("click", naoClick);
      });
    }

    // ---------- Carregar usuários ----------
    function carregarUsuarios() {
      const carregando = document.getElementById("carregando");
      carregando.style.display = "block";

      fetch("/usuarios")
        .then(resposta => resposta.json())
        .then(usuarios => {
          carregando.style.display = "none";
          const lista = document.getElementById("lista-usuarios");
          lista.innerHTML = "";

          if (usuarios.length === 0) {
            lista.innerHTML = "<p style='color:#888;'>Nenhum usuário cadastrado ainda.</p>";
            return;
          }

          usuarios.forEach(usuario => {
            const item = document.createElement("li");

            const span = document.createElement("span");
            span.textContent = `${usuario.nome} - ${usuario.curso}`;

            const botaoEditar = document.createElement("button");
            botaoEditar.innerHTML = '<i class="fa-solid fa-pen"></i>';
            botaoEditar.onclick = function () {
              const novoNome = prompt("Novo nome:", usuario.nome);
              const novoCurso = prompt("Novo curso:", usuario.curso);
              if (novoNome && novoCurso) {
                fetch(`/usuarios/${usuario.id}`, {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ nome: novoNome, curso: novoCurso })
                }).then(() => {
                  mostrarToast("Usuário atualizado!");
                  carregarUsuarios();
                });
              }
            };

            const botaoDeletar = document.createElement("button");
            botaoDeletar.innerHTML = '<i class="fa-solid fa-trash"></i>';
            botaoDeletar.onclick = async function () {
              const confirmou = await confirmarAcao(`Tem certeza que quer deletar ${usuario.nome}?`);
              if (confirmou) {
                fetch(`/usuarios/${usuario.id}`, {
                  method: "DELETE"
                }).then(() => {
                  mostrarToast("Usuário deletado!");
                  carregarUsuarios();
                });
              }
            };

            item.appendChild(span);
            item.appendChild(botaoEditar);
            item.appendChild(botaoDeletar);
            lista.appendChild(item);
          });
        })
        .catch(() => {
          carregando.textContent = "Erro ao carregar. Tente recarregar a página.";
        });
    }

    carregarUsuarios();

    // ---------- Formulário ----------
    const form = document.getElementById("form-usuario");
    form.addEventListener("submit", function (evento) {
      evento.preventDefault();

      const nome = document.getElementById("input-nome").value.trim();
      const curso = document.getElementById("input-curso").value.trim();

      if (nome === "" || curso === "") {
        mostrarToast("Preencha nome e curso corretamente!", "erro");
        return;
      }

      fetch("/usuarios", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, curso })
      }).then(() => {
        mostrarToast("Usuário adicionado!");
        carregarUsuarios();
        form.reset();
      });
    });
  </script>
</body>
</html>
